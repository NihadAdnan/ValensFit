<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="laurelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0C0E14"/>
    </linearGradient>
  </defs>

  <!-- Background Shield / Coin -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left Laurel Wreath -->
  <g fill="url(#laurelGrad)">
    <!-- Base Leaf -->
    <path d="M 30 52 C 27 50, 24 49, 21 51 C 23 48, 25 47, 28 49 Z"/>
    <!-- Leaf Pair 1 -->
    <path d="M 23 47 C 19 45, 16 43, 14 46 C 16 42, 19 41, 22 43 Z"/>
    <path d="M 21 42 C 17 40, 15 36, 12 38 C 15 35, 18 36, 20 39 Z"/>
    <!-- Leaf Pair 2 -->
    <path d="M 19 36 C 15 33, 14 28, 11 30 C 14 27, 18 29, 19 33 Z"/>
    <path d="M 19 30 C 16 26, 16 21, 13 22 C 16 20, 19 23, 20 27 Z"/>
    <!-- Leaf Pair 3 -->
    <path d="M 22 24 C 20 19, 21 14, 18 15 C 21 14, 24 17, 24 21 Z"/>
    <!-- Crown Top Left -->
    <path d="M 26 18 C 25 14, 28 10, 26 10 C 27 11, 29 14, 28 17 Z"/>

    <!-- Right Laurel Wreath (Symmetric) -->
    <!-- Base Leaf -->
    <path d="M 34 52 C 37 50, 40 49, 43 51 C 41 48, 39 47, 36 49 Z"/>
    <!-- Leaf Pair 1 -->
    <path d="M 41 47 C 45 45, 48 43, 50 46 C 48 42, 45 41, 42 43 Z"/>
    <path d="M 43 42 C 47 40, 49 36, 52 38 C 49 35, 46 36, 44 39 Z"/>
    <!-- Leaf Pair 2 -->
    <path d="M 45 36 C 49 33, 50 28, 53 30 C 50 27, 46 29, 45 33 Z"/>
    <path d="M 45 30 C 48 26, 48 21, 51 22 C 48 20, 45 23, 44 27 Z"/>
    <!-- Leaf Pair 3 -->
    <path d="M 42 24 C 44 19, 43 14, 46 15 C 43 14, 40 17, 40 21 Z"/>
    <!-- Crown Top Right -->
    <path d="M 38 18 C 39 14, 36 10, 38 10 C 37 11, 35 14, 36 17 Z"/>
    
    <!-- Central Laurel Stem -->
    <path d="M 31 54 A 18 18 0 0 1 25 16" fill="none" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 33 54 A 18 18 0 0 0 39 16" fill="none" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Bottom Knot -->
    <circle cx="32" cy="54" r="1.5" fill="#34D399"/>
  </g>

  <!-- Roman Imperial V (Centered in Wreath) -->
  <path d="M 23 25 L 28 25 L 32 40 L 36 25 L 41 25 L 34.5 45 L 29.5 45 Z" fill="#FFFFFF"/>
  <path d="M 22 25 L 28 25 L 28 26.5 L 25.5 26.5 L 30.5 42 L 32 42 L 32 44 L 29.5 44 Z" fill="#34D399" opacity="0.8"/>
</svg>
